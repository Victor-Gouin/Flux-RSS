services:
  flux-rss:
    image: ghcr.io/victor-gouin/flux-rss:latest
    container_name: flux-rss
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # En local : ./data:/app/data
      # Sur Unraid : /mnt/user/appdata/flux-rss:/app/data
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_DIR=/app/data
      - ADMIN_USER=admin
      - ADMIN_PASSWORD=admin1234
